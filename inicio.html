<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de inicio</title>
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/inicio.js" defer></script>
</head>
<body>
  <main class="contenedor">
    <h1>Bienvenido</h1>
    <h2 id="bienvenida"></h2>
    <p>Has iniciado sesión correctamente.</p>
    <button id="cerrarSesion" type="button">Cerrar sesión</button>
  </main>
  <section>
    <h2>Registro de compras</h2>
    <form id="formulario">
      <label>Nombre del cliente:<input type="text" name="cliente" required></label>
      <label>Número de documento:<input type="text" name="documento" required></label>
      <label>Correo electrónico:<input type="email" name="correo" required></label>
      <label>Teléfono:<input type="tel" name="telefono" required></label>
      <label>Nombre del producto:<input type="text" name="producto" required></label>
      <label>Categoría:<input type="text" name="categoria" required></label>
      <label>Código del producto:<input type="text" name="codigo" required></label>
      <label>Cantidad:<input type="number" name="cantidad" min="1" step="1" required></label>
      <label>Valor unitario:<input type="number" name="valorUnitario" min="0" step="0.01" required></label>
      <label>Fecha de compra:<input type="date" name="fecha" required></label>
      <label>Método de pago:
        <select name="metodoPago" required>
          <option value="">Selecciona una opción</option>
          <option value="Efectivo">Efectivo</option>
          <option value="Tarjeta">Tarjeta</option>
          <option value="Transferencia">Transferencia</option>
          <option value="Otro">Otro</option>
        </select>
      </label>
      <label>Ciudad:<input type="text" name="ciudad" required></label>
      <label>Dirección:<input type="text" name="direccion" required></label>
      <label>Nombre del vendedor:<input type="text" name="vendedor" required></label>
      <label>Observaciones:<input type="text" name="observaciones" required></label>
      <button type="submit">Guardar compra</button>
    </form>
    <h2>Compras registradas</h2>
    <div id="registros"></div>
  </section>
</body>
</html>
